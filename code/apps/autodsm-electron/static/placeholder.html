<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AutoDSM</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f0f12;
        color: #e7e7ea;
        font:
          13px/1.4 -apple-system,
          system-ui,
          Inter,
          sans-serif;
      }
      .sidebar {
        width: 320px;
        height: 100vh;
        padding: 16px;
        box-sizing: border-box;
        border-right: 1px solid #1f1f24;
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow-y: auto;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #9b8cff;
      }
      h2 {
        margin: 12px 0 4px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #6e6e78;
      }
      p {
        margin: 4px 0;
        color: #a0a0aa;
      }
      button {
        margin-top: 4px;
        padding: 8px 14px;
        background: #1c1c22;
        color: #e7e7ea;
        border: 1px solid #2a2a32;
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        border-color: #9b8cff;
        color: #c0b3ff;
      }
      .badge {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 999px;
        background: #1c1c22;
        border: 1px solid #2a2a32;
        color: #a0a0aa;
        font-size: 11px;
      }
      .badge.ok {
        border-color: #3a4a36;
        color: #b6e0a3;
      }
      .badge.err {
        border-color: #4a2f2f;
        color: #f6a89c;
      }
      .badge.purple {
        border-color: #2e2456;
        color: #c0b3ff;
      }
      dl {
        margin: 0;
        font-size: 12px;
      }
      dt {
        color: #6e6e78;
        margin-top: 6px;
      }
      dd {
        margin: 0;
        color: #d0d0d8;
        word-break: break-all;
      }
      ul.components {
        list-style: none;
        margin: 0;
        padding: 0;
        font-size: 12px;
      }
      ul.components li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 4px 6px;
        border-radius: 4px;
      }
      ul.components li:hover {
        background: #16161c;
      }
      ul.components button.generate {
        margin: 0;
        padding: 1px 6px;
        font-size: 10px;
        background: transparent;
        color: #c0b3ff;
        border: 1px solid #2e2456;
        border-radius: 3px;
      }
      ul.components button.generate:hover {
        background: #1a1a28;
        border-color: #9b8cff;
      }
      ul.components button.generate:disabled {
        color: #555;
        border-color: #2a2a32;
        cursor: progress;
      }
      ul.components .name {
        color: #d0d0d8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      ul.components .status {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 999px;
        border: 1px solid #2a2a32;
        color: #6e6e78;
        flex-shrink: 0;
      }
      ul.components .status.ready {
        border-color: #3a4a36;
        color: #b6e0a3;
      }
      ul.components .status.missing-story {
        border-color: #4a4434;
        color: #e0c994;
      }
      .stats {
        font-size: 11px;
        color: #6e6e78;
      }
      .agent {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid #1f1f24;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .agent-transcript {
        max-height: 240px;
        overflow-y: auto;
        font-size: 12px;
        background: #16161c;
        border-radius: 6px;
        padding: 8px;
      }
      .agent-turn {
        margin-bottom: 6px;
        padding: 4px 8px;
        border-radius: 4px;
      }
      .agent-turn.user {
        background: #2e2456;
        color: #c0b3ff;
      }
      .agent-turn.assistant {
        background: #1c1c22;
        color: #e7e7ea;
      }
      .agent-turn.tool {
        background: #1a2a1a;
        color: #b6e0a3;
        font-family: ui-monospace, monospace;
        font-size: 11px;
      }
      .agent-turn.error {
        background: #2a1a1a;
        color: #f6a89c;
      }
      .agent input {
        width: 100%;
        padding: 6px 8px;
        background: #1c1c22;
        color: #e7e7ea;
        border: 1px solid #2a2a32;
        border-radius: 4px;
        box-sizing: border-box;
        font: inherit;
      }
      .agent input:focus {
        outline: none;
        border-color: #9b8cff;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <h1>AutoDSM</h1>
      <p>Sprint 6 — IPC + auth + agent runtime.</p>
      <button id="open">Open Folder</button>
      <span class="badge" id="status">No project loaded</span>
      <span class="badge" id="auth-badge">Auth: probing…</span>

      <dl id="details" class="hidden">
        <dt>Repo</dt>
        <dd id="repo"></dd>
        <dt>Framework</dt>
        <dd id="framework"></dd>
        <dt>Storybook</dt>
        <dd id="sb"></dd>
        <dt>Preview</dt>
        <dd id="preview"></dd>
      </dl>

      <div id="indexer-section" class="hidden">
        <h2>Components <span class="stats" id="component-stats"></span></h2>
        <ul class="components" id="component-list"></ul>
        <h2>Tokens <span class="stats" id="token-stats"></span></h2>
        <p class="stats" id="token-summary"></p>
      </div>

      <div class="agent" id="agent-section">
        <h2>Agent <span class="stats" id="agent-status"></span></h2>
        <div class="agent-transcript" id="agent-transcript"></div>
        <input id="agent-input" type="text" placeholder="Ask the agent…" />
      </div>
    </div>
    <script>
      const open = document.getElementById('open');
      const status = document.getElementById('status');
      const authBadge = document.getElementById('auth-badge');
      const details = document.getElementById('details');
      const elRepo = document.getElementById('repo');
      const elFramework = document.getElementById('framework');
      const elSb = document.getElementById('sb');
      const elPreview = document.getElementById('preview');
      const indexerSection = document.getElementById('indexer-section');
      const componentList = document.getElementById('component-list');
      const componentStats = document.getElementById('component-stats');
      const tokenStats = document.getElementById('token-stats');
      const tokenSummary = document.getElementById('token-summary');
      const agentTranscript = document.getElementById('agent-transcript');
      const agentInput = document.getElementById('agent-input');
      const agentStatus = document.getElementById('agent-status');

      const setStatus = (msg, kind) => {
        status.textContent = msg;
        status.className = `badge${kind ? ` ${kind}` : ''}`;
      };

      const setAuthBadge = (auth) => {
        const ok = auth.kind !== 'none';
        authBadge.textContent = `Auth: ${auth.readable}`;
        authBadge.className = `badge ${
          auth.kind === 'subscription' || auth.kind === 'oauth-token'
            ? 'ok'
            : auth.kind === 'none'
              ? 'err'
              : 'purple'
        }`;
        agentInput.disabled = !ok;
      };

      const appendTurn = (kind, text) => {
        const div = document.createElement('div');
        div.className = `agent-turn ${kind}`;
        div.textContent = text;
        agentTranscript.appendChild(div);
        agentTranscript.scrollTop = agentTranscript.scrollHeight;
      };

      open.addEventListener('click', async () => {
        setStatus('Opening folder picker…');
        try {
          await window.autodsm.openFolder();
        } catch (err) {
          setStatus(`Error: ${err.message ?? err}`, 'err');
        }
      });

      window.autodsm.onProjectOpened((payload) => {
        details.classList.remove('hidden');
        elRepo.textContent = payload.repoRoot;
        elFramework.textContent = payload.framework;
        elSb.textContent = payload.hasExistingStorybook
          ? 'existing .storybook/'
          : 'AutoDSM-managed (.autodsm/storybook/)';
        elPreview.textContent = 'starting…';
        setStatus(`Booting ${payload.framework}…`);
        indexerSection.classList.remove('hidden');
        componentList.innerHTML = '<li class="status">scanning…</li>';
        componentStats.textContent = '';
        tokenStats.textContent = '';
        tokenSummary.textContent = '';
      });

      window.autodsm.onPreviewStarted((payload) => {
        elPreview.textContent = payload.address;
        setStatus('Preview ready', 'ok');
      });
      window.autodsm.onPreviewError((payload) => {
        elPreview.textContent = '—';
        setStatus(`Preview error: ${payload.message}`, 'err');
      });

      window.autodsm.onIndexerResult((payload) => {
        componentList.innerHTML = '';
        const limit = 200;
        const components = payload.components.slice(0, limit);
        for (const c of components) {
          const li = document.createElement('li');
          li.dataset.componentId = c.id;
          const name = document.createElement('span');
          name.className = 'name';
          name.title = c.sourcePath;
          name.textContent = c.name || c.exportName;
          const right = document.createElement('span');
          right.style.display = 'flex';
          right.style.gap = '6px';
          right.style.alignItems = 'center';
          right.style.flexShrink = '0';

          if (c.status === 'missing-story') {
            const gen = document.createElement('button');
            gen.className = 'generate';
            gen.textContent = 'Generate';
            gen.addEventListener('click', async () => {
              gen.disabled = true;
              gen.textContent = '…';
              try {
                await window.autodsm.generateStub(c.id);
              } catch (err) {
                gen.disabled = false;
                gen.textContent = 'Generate';
                console.error(err);
              }
            });
            right.appendChild(gen);
          }

          const badge = document.createElement('span');
          badge.className = `status ${c.status}`;
          badge.textContent = c.status === 'ready' ? '●' : '○';
          badge.title = c.status;
          right.appendChild(badge);

          li.appendChild(name);
          li.appendChild(right);
          componentList.appendChild(li);
        }
        if (payload.components.length > limit) {
          const more = document.createElement('li');
          more.className = 'stats';
          more.textContent = `+${payload.components.length - limit} more`;
          componentList.appendChild(more);
        }

        const s = payload.stats;
        componentStats.textContent = `${s.components} (${s.componentsWithStories} ready)`;
        tokenStats.textContent = `${s.tokens}`;

        const byCategory = {};
        for (const t of payload.tokens) {
          byCategory[t.category] = (byCategory[t.category] ?? 0) + 1;
        }
        tokenSummary.textContent =
          Object.entries(byCategory)
            .map(([k, v]) => `${k}:${v}`)
            .join(' · ') || 'none detected';
      });

      window.autodsm.onStubGenerated((payload) => {
        setStatus(`Generated ${payload.stagedPath.split('/').slice(-2).join('/')}`, 'ok');
      });
      window.autodsm.onStubError((payload) => {
        setStatus(`Stub error: ${payload.message}`, 'err');
      });

      // Agent panel.
      const refreshAuth = async () => {
        const auth = await window.autodsm.getAuthStatus();
        setAuthBadge(auth);
      };
      refreshAuth();

      agentInput.addEventListener('keydown', async (e) => {
        if (e.key !== 'Enter') return;
        const prompt = agentInput.value.trim();
        if (!prompt) return;
        agentInput.value = '';
        appendTurn('user', prompt);
        agentStatus.textContent = '…';
        try {
          await window.autodsm.agentQuery(prompt);
        } catch (err) {
          appendTurn('error', err.message ?? String(err));
          agentStatus.textContent = 'error';
        }
      });

      window.autodsm.onAgentTurn((payload) => {
        if (payload.type === 'text') appendTurn('assistant', payload.text);
        else if (payload.type === 'tool_use')
          appendTurn('tool', `→ ${payload.name}(${JSON.stringify(payload.input)})`);
        else if (payload.type === 'tool_result')
          appendTurn('tool', `← ${JSON.stringify(payload.content).slice(0, 120)}`);
        else if (payload.type === 'error') appendTurn('error', payload.message);
      });
      window.autodsm.onAgentDone((payload) => {
        agentStatus.textContent = `done (${payload.code ?? '?'})`;
      });
    </script>
  </body>
</html>
